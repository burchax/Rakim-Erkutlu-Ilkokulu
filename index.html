        ],
        '1-B': [

          'ARYA CAYMAZ', 'HAVİN OCAĞ', 'BUĞLEM ADA MATSAR', 'DENİZ ÖZSOY', 
          'ELANUR UZTEMUR', 'HÜMEYRA DAĞTEKİN', 'MUAZ ALİ KULAŞ', 'YAĞIZ PİRENVİSE', 
          'FERHAT MURAD', 'NURİ NAİF', 'MUHAMMED MUHAMMED', 'HANİN HERFAN', 
          'YUSUF ELUKLA', 'İBRAHİM HAMZA', 'MUSTAFA HAMZA', 'NURELHUDE RECEP'
        ],
        '2-A': [
          'ABDULLAH BÜLKÜ', 'BERAT KULAŞ', 'DEVRAN ÖZSOY', 'ESİLA ÖRDEK', 
          'ESLEM YURT', 'MİNA EVRA DÖĞER', 'MUHAMMED EYMEN ÖZSOY', 'YUSUF İVEDİ', 
          'NİSANUR AKDAĞ', 'BERIVAN ÖRDEK', 'EZGİ ULUTAŞ', 'HÜLYA ÜREYİL', 
          'MUHAMMED HÜSEYİN DEĞİRMENCİ', 'AHMED ABDULRAHMAN', 'RUSLIN OSMAN', 'MUHAMMED SIDO', 
          'HATTAB BERGUT', 'RUHEF HAKKI', 'AYŞE ALHALO', 'İLEF AHMED'
        ],
        '2-B': [
          'ALPER AYDOĞAN', 'REYYAN ŞANİ', 'HALİL YILDIRIM', 'MEHMET TALHA KURNAZ', 
          'MUHAMMED SELİM BÜLKÜ', 'ÖYKÜ YILMAZ', 'ELİF KOSKA', 'FATMANUR ÇELİK', 
          'GÜLŞAH RONAHİ KEVSER ECEVİT', 'KADER KORKMAZ', 'ARAS BULUT YARIMAY', 'ASMİN MATSAR', 
          'HIRANUR CEMİLE ÇİÇEKLİ', 'TUĞBA ULUTAŞ', 'BEYZANUR BÜLBÜL', 'MUHAMMAD ABDURRAHMAN', 
          'MAHMUD HAMİDİ', 'AHMED AHMED', 'AHMED KADEK'
        ],
        '3-A': [
          'ARYA OKULMUŞ', 'AYSİMA ÖRDEK', 'AYŞE GÜL ORUÇ', 'BURAK ECEVÍT', 
          'DEFNE SU ÇETİN', 'ELISA SU BAYRAM', 'MUHAMMED EMİR YAĞAR', 'YUSUF CAN ÇİÇEKLİ', 
          'HÜSEYİN HABEŞ', 'ROYA ALO', 'NUCIN HIDDO', 'BAHAR KADEK', 
          'HOZAN HACMUSA', 'MEYSA ABDULRAHMAN', 'MUHAMMED KUR'
        ],
        '3-B': [
          'ABDULRAHΜΑΝ HANNUŞ', 'HIRA NUR GÖKSU', 'HÜSEYİN DAĞTEKİN', 'MİRAÇ ÖRDEK', 
          'CANE HANNUŞ', 'NEHİR UZAR', 'POYRAZ ÖZEL', 'ÜZEYİR BÜLKÜ', 
          'MİRAN KORKMAZ', 'ASEL ÖZMEN', 'MENESA ORAL', 'KAMAR SIDO', 
          'MIRAL SIDO', 'RULA KADEK', 'YUNUS OSMAN', 'MAHMUD BARGUD'
        ],
        '4-A': [
          'BERFİN ÖRDEK', 'EMİR HAKİM ÇELİK', 'HIRANUR AKDAĞ', 'HÜSEYİN EKREM OKULMUŞ', 
          'İBRAHİM BUĞRA SEÇEN', 'YİĞİT HAKTAN KULACA', 'MUHAMMED EYÜP BİLGİLİ', 'REŞAT CEMAL CAN ECEVİT', 
          'ESILA AKÇAY', 'HİRANUR ARTIK', 'ZEYNEP TAMİRCAN', 'NAZENİN KARAKAYA', 
          'MUHAMMED MAMO', 'RONI ALO', 'MUHAMMED HAMMET', 'AHMED MUHAMMED', 
          'YASEMIN RESO', 'MUHAMMED HAMZA', 'NECAT HAMIDI', 'ILYANA ABDURRAHMAN'
        ],
        '4-B': [
          'ALİ EREN SEVEN', 'BERAT ALPASLAN DINDAR', 'BETÜL MATSAR', 'BİLGESU BARAN', 
          'EREN YARIMAY', 'MEHMET ALİ ERKUŞ', 'ÖMER ALİ KESER', 'SALİH UYGÜL', 
          'SEYFETTİN MİRAÇ HASATEŞ', 'HALİL İBRAHİM KAYA', 'DERİN OKULMUŞ', 'BERZAN BİLMEDİ', 
          'YUSUF ÇİÇEKLİ', 'DURU RÜYA ASLAN', 'NEHİR ECEVİT', 'BÜŞRA AYAZ', 
          'MELISA ECEVİT', 'NAIF HERFAN', 'SEMİR DABDABEN', 'VOLKAN HASAN'
        ]
      }
    };

    // Uygulama Durumu (State)
    let currentStep = 'classes'; // 'classes', 'events', 'students'
    let selectedClass = null;
    let selectedEvent = null;
    let records = {}; // Key: "sınıf_etkinlik_öğrenci", Value: "katilim" | "performans"

    function render() {
      const app = document.getElementById('app');
      
      // 1. ADIM: Sınıf Seçimi
      if (currentStep === 'classes') {
        app.innerHTML = `
          <h1 class="text-xl font-bold text-center mb-6 text-gray-800">Sınıf Seçiniz</h1>
          <div class="grid grid-cols-2 gap-3">
            ${data.classes.map(c => `
              <button onclick="selectClass('${c}')" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow">
                ${c} Sınıfı
              </button>
            `).join('')}
          </div>
        `;
      } 
      // 2. ADIM: Etkinlik Listesi
      else if (currentStep === 'events') {
        app.innerHTML = `
          <div class="flex items-center mb-6">
            <button onclick="goBack('classes')" class="text-sm bg-gray-200 px-3 py-1 rounded mr-3">← Sınıf Değiştir</button>
            <h1 class="text-lg font-bold text-gray-800">${selectedClass} - Etkinlikler</h1>
          </div>
          <div class="space-y-3">
            ${data.events.map(ev => {
              const isCompleted = checkEventCompleted(selectedClass, ev);
              return `
                <button onclick="selectEvent('${ev}')" class="w-full p-4 rounded-lg border text-left flex justify-between items-center ${isCompleted ? 'bg-green-100 border-green-500 text-green-900' : 'bg-gray-50 border-gray-200 text-gray-800'}">
                  <span class="font-medium">${ev}</span>${isCompleted ? '<span class="text-green-600 font-bold">✔️ Tamamlandı</span>' : ''}
                </button>
              `;
            }).join('')}
          </div>
        `;
      } 
      // 3. ADIM: Öğrenci Listesi & İşaretleme
      else if (currentStep === 'students') {
        const studentList = data.students[selectedClass] || [];
        app.innerHTML = `
          <div class="flex items-center mb-4">
            <button onclick="goBack('events')" class="text-sm bg-gray-200 px-3 py-1 rounded mr-3">← Etkinlikler</button>
            <div>
              <h1 class="text-base font-bold text-gray-800">${selectedEvent}</h1>
              <p class="text-xs text-gray-500">${selectedClass} Sınıfı (${studentList.length} Öğrenci)</p>
            </div>
          </div>

          <div class="space-y-3 my-6 max-h-[60vh] overflow-y-auto pr-1">
            ${studentList.map(st => {
              const key = `${selectedClass}_${selectedEvent}_${st}`;
              const val = records[key];
              return `
                <div class="p-3 bg-gray-50 rounded-lg border flex flex-col space-y-2">
                  <span class="font-medium text-gray-700">${st}</span>
                  <div class="flex space-x-2">
                    <button onclick="toggleSelect('${st}', 'katilim')" class="flex-1 py-1.5 text-xs font-semibold rounded border ${val === 'katilim' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300'}">
                      Katılım
                    </button>
                    <button onclick="toggleSelect('${st}', 'performans')" class="flex-1 py-1.5 text-xs font-semibold rounded border ${val === 'performans' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-gray-600 border-gray-300'}">
                      Performans / Ürün
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <button onclick="saveData()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow">
            Kaydet
          </button>
        `;
      }
    }

    // Navigasyon ve Mantık Fonksiyonları
    function selectClass(c) { selectedClass = c; currentStep = 'events'; render(); }
    function selectEvent(ev) { selectedEvent = ev; currentStep = 'students'; render(); }
    function goBack(step) { currentStep = step; render(); }

    function toggleSelect(student, type) {
      const key = `${selectedClass}_${selectedEvent}_${student}`;
      if (records[key] === type) {
        delete records[key]; // İkinci kez tıklanınca seçimi kaldırır (Toggle)
      } else {
        records[key] = type;
      }
      render();
    }

    function saveData() {
      alert('Kayıt başarıyla tamamlandı!');
      currentStep = 'events';
      render();
    }

    function checkEventCompleted(sClass, sEvent) {
      return Object.keys(records).some(k => k.startsWith(`${sClass}_${sEvent}_`));
    }

    // İlk Çalıştırma
    render();
  </script>
</body>
</html>
