<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen Paneli</title>
  <meta property="og:title" content="Öğretmen Paneli" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase CDN Bağlantıları (v10 - Web Uyumlu Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Yapılandırma Bilgileriniz
    const firebaseConfig = {
      apiKey: "AIzaSyBICjJMMMT3Z1FgsbR2kaUIhNrqvRcg7wM",
      authDomain: "rakim-erkutlu-io-ogretmen.firebaseapp.com",
      projectId: "rakim-erkutlu-io-ogretmen",
      storageBucket: "rakim-erkutlu-io-ogretmen.firebasestorage.app",
      messagingSenderId: "35323173695",
      appId: "1:35323173695:web:3031e2107a3e3bf0c8918a"
    };

    // Firebase Başlatma
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global Değişkenler
    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
    window.addDoc = addDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.deleteDoc = deleteDoc;
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased p-4 md:p-6">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden relative" id="app"></div>

  <script>
    // Rakım Erkutlu İlkokulu Sınıf ve Öğrenci Verileri
    const data = {
      classes: ['1-A', '1-B', '2-A', '2-B', '3-A', '3-B', '4-A', '4-B'],
      events: [], // Buluttan dinamik çekilecek
      students: {
        '1-A': ['ALYA DEVRİM AYDIN', 'AYŞE NİSA ECEVİT', 'AZRA ÇATAN', 'EFE MEHMET AKTAN', 'EMRAH SERPEN', 'MEHMET SELİM ÖRDEK', 'MİRAN EMİN DEMİR', 'YAREN BÜLBÜL', 'MİRAÇ ASİL YÖRE', 'ROJHAT ECEVİT', 'MUHAMMED NAIF', 'YUSUF DABDABEN', 'HALE HIRFAN', 'SEM HIRFAN', 'YAKUP EL UGLA', 'VAHID TAHHAN', 'NIDAL NAIF', 'AYŞE HIRFAN', 'MIRAL ELHACTALİB'],
        '1-B': ['AHMET ÖZMEN', 'NEFES ÜSTEBAY', 'ALİ YÜCEL', 'ALMİNA MASAL BİLMEDİ', 'ARYA CAYMAZ', 'HAVİN OCAĞ', 'BUĞLEM ADA MATSAR', 'DENİZ ÖZSOY', 'ELANUR UZTEMUR', 'HÜMEYRA DAĞTEKİN', 'MUAZ ALİ KULAŞ', 'YAĞIZ PİRENVİSE', 'FERHAT MURAD', 'NURİ NAİF', 'MUHAMMED MUHAMMED', 'HANİN HERFAN', 'YUSUF ELUKLA', 'İBRAHİM HAMZA', 'MUSTAFA HAMZA', 'NURELHUDE RECEP'],
        '2-A': ['ABDULLAH BÜLKÜ', 'BERAT KULAŞ', 'DEVRAN ÖZSOY', 'ESİLA ÖRDEK', 'ESLEM YURT', 'MİNA EVRA DÖĞER', 'MUHAMMED EYMEN ÖZSOY', 'YUSUF İVEDİ', 'NİSANUR AKDAĞ', 'BERIVAN ÖRDEK', 'EZGİ ULUTAŞ', 'HÜLYA ÜREYİL', 'MUHAMMED HÜSEYİN DEĞİRMENCİ', 'AHMED ABDULRAHMAN', 'RUSLIN OSMAN', 'MUHAMMED SIDO', 'HATTAB BERGUT', 'RUHEF HAKKI', 'AYŞE ALHALO', 'İLEF AHMED'],
        '2-B': ['ALPER AYDOĞAN', 'REYYAN ŞANİ', 'HALİL YILDIRIM', 'MEHMET TALHA KURNAZ', 'MUHAMMED SELİM BÜLKÜ', 'ÖYKÜ YILMAZ', 'ELİF KOSKA', 'FATMANUR ÇELİK', 'GÜLŞAH RONAHİ KEVSER ECEVİT', 'KADER KORKMAZ', 'ARAS BULUT YARIMAY', 'ASMİN MATSAR', 'HIRANUR CEMİLE ÇİÇEKLİ', 'TUĞBA ULUTAŞ', 'BEYZANUR BÜLBÜL', 'MUHAMMAD ABDURRAHMAN', 'MAHMUD HAMİDİ', 'AHMED AHMED', 'AHMED KADEK'],
        '3-A': ['ARYA OKULMUŞ', 'AYSİMA ÖRDEK', 'AYŞE GÜL ORUÇ', 'BURAK ECEVÍT', 'DEFNE SU ÇETİN', 'ELISA SU BAYRAM', 'MUHAMMED EMİR YAĞAR', 'YUSUF CAN ÇİÇEKLİ', 'HÜSEYİN HABEŞ', 'ROYA ALO', 'NUCIN HIDDO', 'BAHAR KADEK', 'HOZAN HACMUSA', 'MEYSA ABDULRAHMAN', 'MUHAMMED KUR'],
        '3-B': ['ABDULRAHΜΑΝ HANNUŞ', 'HIRA NUR GÖKSU', 'HÜSEYİN DAĞTEKİN', 'MİRAÇ ÖRDEK', 'CANE HANNUŞ', 'NEHİR UZAR', 'POYRAZ ÖZEL', 'ÜZEYİR BÜLKÜ', 'MİRAN KORKMAZ', 'ASEL ÖZMEN', 'MENESA ORAL', 'KAMAR SIDO', 'MIRAL SIDO', 'RULA KADEK', 'YUNUS OSMAN', 'MAHMUD BARGUD'],
        '4-A': ['BERFİN ÖRDEK', 'EMİR HAKİM ÇELİK', 'HIRANUR AKDAĞ', 'HÜSEYİN EKREM OKULMUŞ', 'İBRAHİM BUĞRA SEÇEN', 'YİĞİT HAKTAN KULACA', 'MUHAMMED EYÜP BİLGİLİ', 'REŞAT CEMAL CAN ECEVİT', 'ESILA AKÇAY', 'HİRANUR ARTIK', 'ZEYNEP TAMİRCAN', 'NAZENİN KARAKAYA', 'MUHAMMED MAMO', 'RONI ALO', 'MUHAMMED HAMMET', 'AHMED MUHAMMED', 'YASEMIN RESO', 'MUHAMMED HAMZA', 'NECAT HAMIDI', 'ILYANA ABDURRAHMAN'],
        '4-B': ['ALİ EREN SEVEN', 'BERAT ALPASLAN DINDAR', 'BETÜL MATSAR', 'BİLGESU BARAN', 'EREN YARIMAY', 'MEHMET ALİ ERKUŞ', 'ÖMER ALİ KESER', 'SALİH UYGÜL', 'SEYFETTİN MİRAÇ HASATEŞ', 'HALİL İBRAHİM KAYA', 'DERİN OKULMUŞ', 'BERZAN BİLMEDİ', 'YUSUF ÇİÇEKLİ', 'DURU RÜYA ASLAN', 'NEHİR ECEVİT', 'BÜŞRA AYAZ', 'MELISA ECEVİT', 'NAIF HERFAN', 'SEMİR DABDABEN', 'VOLKAN HASAN']
      }
    };

    let activeTab = 'social';
    let currentStep = 'classes';
    let selectedClass = null;
    let selectedEventObj = null;
    let records = {};
    let isMenuOpen = false;

    // Firebase Gerçek Zamanlı Dinleyiciyi Başlatma
    function initFirebaseListener() {
      if (!window.db) {
        setTimeout(initFirebaseListener, 200);
        return;
      }
      
      // Etkinlikleri Buluttan Canlı Dinle
      window.onSnapshot(window.collection(window.db, "events"), (snapshot) => {
        data.events = [];
        snapshot.forEach((doc) => {
          data.events.push({ id: doc.id, ...doc.data() });
        });

        // Veritabanı bomboşsa ilk olarak varsayılan İlköğretim Haftası etkinliğini ekle
        if (data.events.length === 0) {
          window.addDoc(window.collection(window.db, "events"), {
            name: "İlköğretim Haftası Programı",
            date: "21-25 Eylül 2026"
          });
        }
        render();
      });

      // Öğrenci Kayıtlarını Buluttan Canlı Dinle
      window.onSnapshot(window.collection(window.db, "records"), (snapshot) => {
        records = {};
        snapshot.forEach((doc) => {
          records[doc.id] = doc.data().val;
        });
        render();
      });
    }

    function toggleMenu() { isMenuOpen = !isMenuOpen; render(); }
    function switchTab(tab) { activeTab = tab; currentStep = 'classes'; selectedClass = null; selectedEventObj = null; isMenuOpen = false; render(); }

    function renderHeader() {
      return `
        <div class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-blue-600 p-5 text-white">
          <div class="flex justify-between items-center mb-4">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">Rakım Erkutlu İlkokulu</span>
              <h1 class="text-xl font-bold tracking-tight">Öğretmen Paneli</h1>
            </div>
            <div class="relative">
              <button onclick="toggleMenu()" class="p-2 text-indigo-100 hover:text-white hover:bg-white/10 rounded-lg transition-all text-xl font-bold leading-none">&#8942;</button>
              ${isMenuOpen ? `
                <div class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-slate-100 z-50 py-1.5 text-slate-700">
                  <button onclick="addNewEvent()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium transition-colors"><span class="mr-2">➕</span> Yeni Etkinlik Ekle</button>
                  <button onclick="showMissingClasses()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium border-t border-slate-100 transition-colors"><span class="mr-2">🏫</span> Tamamlanmayan Sınıflar</button>
                  <button onclick="showMissingStudents()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium border-t border-slate-100 transition-colors"><span class="mr-2">📋</span> Verileri Eksik Öğrenciler</button>
                </div>
              ` : ''}
            </div>
          </div>
          <div class="flex space-x-2 bg-indigo-900/40 p-1 rounded-xl backdrop-blur-sm border border-white/10">
            <button onclick="switchTab('social')" class="flex-1 py-2 px-3 text-xs md:text-sm font-semibold rounded-lg transition-all ${activeTab === 'social' ? 'bg-white text-indigo-700 shadow-sm' : 'text-indigo-100 hover:text-white hover:bg-white/5'}">🏆 Sosyal Etkinlik Takip</button>
            <button onclick="switchTab('documents')" class="flex-1 py-2 px-3 text-xs md:text-sm font-semibold rounded-lg transition-all ${activeTab === 'documents' ? 'bg-white text-indigo-700 shadow-sm' : 'text-indigo-100 hover:text-white hover:bg-white/5'}">📁 Evrak Takip</button>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (activeTab === 'documents') {
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6 text-center py-12">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">📁</div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">Evrak Takip Modülü</h3>
            <p class="text-sm text-slate-500 max-w-sm mx-auto mb-6">Bu modül yakında hizmete girecektir.</p>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">⏳ Hazırlık Aşamasında</span>
          </div>
        `;
        return;
      }

      if (currentStep === 'classes') {
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">Sınıf Seçiniz</h2>
            <div class="grid grid-cols-2 gap-3">
              ${data.classes.map(c => `
                <button onclick="selectClass('${c}')" class="p-4 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl font-bold text-slate-700 hover:text-indigo-700 shadow-sm transition-all text-center flex flex-col items-center justify-center space-y-1 group">
                  <span class="text-lg group-hover:scale-110 transition-transform">🏫</span>
                  <span>${c} Sınıfı</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentStep === 'events') {
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6">
            <div class="flex items-center justify-between mb-5">
              <div class="flex items-center space-x-2">
                <span class="text-lg font-bold text-slate-800">${selectedClass} Sınıfı</span>
                <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-semibold">Etkinlik Seçimi</span>
              </div>
              <button onclick="goBack('classes')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-medium transition-colors">← Sınıf Değiştir</button>
            </div>
            <div class="space-y-3">
              ${data.events.length === 0 ? '<p class="text-sm text-slate-400 text-center py-4">Henüz etkinlik bulunmuyor...</p>' : ''}
              ${data.events.map(ev => {
                const isCompleted = checkEventCompleted(selectedClass, ev.name);
                return `
                  <div class="p-4 rounded-xl border flex justify-between items-center transition-all ${isCompleted ? 'bg-emerald-50/60 border-emerald-200 text-emerald-900 shadow-sm' : 'bg-white border-slate-200 shadow-sm'}">
                    <div class="flex-1 cursor-pointer pr-3" onclick="selectEvent('${ev.id}')">
                      <div class="flex items-center space-x-2">
                        <span class="font-bold text-sm text-slate-800 hover:text-indigo-600">${ev.name}</span>${isCompleted ? '<span class="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2 py-0.5 rounded-full">✔️ Tamamlandı</span>' : ''}
                      </div>
                      <p class="text-xs text-slate-500 font-medium mt-0.5">📅 Tarih: ${ev.date || 'Belirtilmedi'}</p>
                    </div>
                    <div class="flex items-center space-x-1 border-l border-slate-100 pl-2">
                      <button onclick="editEventDirectly('${ev.id}')" title="Düzenle" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors text-xs font-semibold">✏️</button>
                      <button onclick="deleteEventDirectly('${ev.id}')" title="Sil" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors text-xs font-semibold">🗑️</button>
                      <button onclick="selectEvent('${ev.id}')" class="ml-1 px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-lg transition-colors">Giriş Yap →</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (currentStep === 'students') {
        const studentList = data.students[selectedClass] || [];
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
              <div>
                <h2 class="text-base font-bold text-slate-800">${selectedEventObj.name}</h2>
                <p class="text-xs text-slate-500 font-medium">${selectedClass} Sınıfı • Tarih: ${selectedEventObj.date}</p>
              </div>
              <button onclick="goBack('events')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-medium transition-colors">← Etkinlikler</button>
            </div>
            <div class="space-y-2.5 my-4 max-h-[50vh] overflow-y-auto pr-1">
              ${studentList.map(st => {
                const key = `${selectedClass}_${selectedEventObj.name}_${st}`;
                const val = records[key];
                return `
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 flex flex-col space-y-2">
                    <span class="font-semibold text-xs text-slate-700 uppercase tracking-wide">${st}</span>
                    <div class="flex space-x-2">
                      <button onclick="toggleSelect('${st}', 'katilim')" class="flex-1 py-1.5 text-xs font-bold rounded-lg border transition-all ${val === 'katilim' ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'}">Katılım</button>
                      <button onclick="toggleSelect('${st}', 'performans')" class="flex-1 py-1.5 text-xs font-bold rounded-lg border transition-all ${val === 'performans' ? 'bg-purple-600 text-white border-purple-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'}">Performans</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <button onclick="saveData()" class="w-full mt-2 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition-all text-sm">Kaydet ve Tamamla</button>
          </div>
        `;
      }
    }

    // Bulut Tabanlı Fonksiyonlar
    async function addNewEvent() {
      isMenuOpen = false;
      const name = prompt("Sosyal Etkinlik Adını Giriniz:");
      if (!name || name.trim() === "") return;
      const date = prompt("Tarih veya Tarih Aralığını Giriniz (Örn: 21-25 Eylül 2026):", "21-25 Eylül 2026");

      await window.addDoc(window.collection(window.db, "events"), {
        name: name.trim(),
        date: date ? date.trim() : 'Belirtilmedi'
      });
      alert(`"${name}" bulut veritabanına eklendi!`);
    }

    async function editEventDirectly(id) {
      const eventObj = data.events.find(e => e.id === id);
      if (!eventObj) return;

      const newName = prompt("Etkinlik Adını Düzenleyin:", eventObj.name);
      if (!newName || newName.trim() === "") return;

      const newDate = prompt("Tarihi Düzenleyin:", eventObj.date);

      await window.updateDoc(window.doc(window.db, "events", id), {
        name: newName.trim(),
        date: newDate ? newDate.trim() : eventObj.date
      });
      alert("Etkinlik bulut üzerinde güncellendi!");
    }

    async function deleteEventDirectly(id) {
      const eventObj = data.events.find(e => e.id === id);
      if (!eventObj) return;

      if (confirm(`"${eventObj.name}" etkinliğini silmek istediğinize emin misiniz?`)) {
        await window.deleteDoc(window.doc(window.db, "events", id));
        alert("Etkinlik buluttan silindi!");
      }
    }

    async function toggleSelect(student, type) {
      const key = `${selectedClass}_${selectedEventObj.name}_${student}`;
      const newVal = records[key] === type ? null : type;
      
      if (newVal) {
        await window.updateDoc(window.doc(window.db, "records", key), { val: newVal }).catch(async () => {
          await window.addDoc(window.collection(window.db, "records"), { id: key, val: newVal });
        });
        records[key] = newVal;
      } else {
        await window.deleteDoc(window.doc(window.db, "records", key)).catch(() => {});
        delete records[key];
      }
      render();
    }

    function showMissingClasses() {
      isMenuOpen = false;
      let targetEventObj = selectedEventObj || data.events[0];
      if (!targetEventObj) return;
      let uncompletedClasses = data.classes.filter(c => !checkEventCompleted(c, targetEventObj.name));
      alert(uncompletedClasses.length === 0 ? `"${targetEventObj.name}" için tüm sınıflarda veri girişi başlatılmış! 🎉` : `"${targetEventObj.name}" için Henüz Giriş Yapmayan Sınıflar:\n\n` + uncompletedClasses.map(c => `• ${c} Sınıfı`).join("\n"));
    }

    function showMissingStudents() {
      isMenuOpen = false;
      let targetEventObj = selectedEventObj || data.events[0];
      if (!targetEventObj) return;
      let missingList = [];
      data.classes.forEach(c => {
        (data.students[c] || []).forEach(st => {
          if (!records[`${c}_${targetEventObj.name}_${st}`]) missingList.push(`[${c}] ${st}`);
        });
      });
      alert(missingList.length === 0 ? `"${targetEventObj.name}" etkinliği için tüm öğrencilerin girişi tamamlanmış! 🎉` : `"${targetEventObj.name}" için Giriş Yapılmayan Öğrenciler (${missingList.length} Kişi):\n\n` + missingList.join("\n"));
    }

    function selectClass(c) { selectedClass = c; currentStep = 'events'; render(); }
    function selectEvent(id) { selectedEventObj = data.events.find(e => e.id === id); currentStep = 'students'; render(); }
    function goBack(step) { currentStep = step; render(); }
    function saveData() { alert('Kayıtlar bulut veritabanında saklandı!'); currentStep = 'events'; render(); }
    function checkEventCompleted(sClass, eventName) { return Object.keys(records).some(k => k.startsWith(`${sClass}_${eventName}_`)); }

    // Uygulamayı ve Bulut Dinleyicisini Başlat
    initFirebaseListener();
    render();
  </script>
</body>
</html>
