<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen Portalı - Rakım Erkutlu İlkokulu</title>

  <!-- Firebase Bulut Veritabanı Bağlantısı -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBICjJMMMT3Z1FgsbR2kaUIhNrqvRcg7wM",
      authDomain: "rakim-erkutlu-io-ogretmen.firebaseapp.com",
      projectId: "rakim-erkutlu-io-ogretmen",
      storageBucket: "rakim-erkutlu-io-ogretmen.firebasestorage.app",
      messagingSenderId: "35323173695",
      appId: "1:35323173695:web:3031e2107a3e3bf0c8918a"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.collection = collection;
      window.onSnapshot = onSnapshot;
      window.doc = doc;
      window.setDoc = setDoc;
    } catch (e) {
      console.error("Firebase bağlantı hatası:", e);
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-top: 10px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { color: #1a365d; font-size: 20px; }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e0;
      background: #edf2f7;
      color: #4a5568;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #3182ce;
      color: #fff;
      border-color: #3182ce;
    }
    .chip-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }
    .chip {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: #2b6cb0;
      color: #fff;
      border-color: #2b6cb0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: left;
    }
    th { background: #edf2f7; color: #2d3748; }
    select, input[type="text"] {
      width: 100%;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      font-size: 11px;
    }
    footer { margin-top: auto; padding-top: 20px; font-size: 11px; color: #a0aec0; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div>
        <h1>🏫 Öğretmen Portalı</h1>
        <span style="font-size: 11px; color: #718096;">Rakım Erkutlu İlkokulu</span>
      </div>
      <!-- Ana Sekmeler: 1. Sosyal Etkinlik, 2. Evrak Takip -->
      <div class="nav-tabs">
        <button onclick="switchTab('etkinlik')" class="tab-btn" id="btn-etkinlik">📊 Sosyal Etkinlik Takip</button>
        <button onclick="switchTab('evrak')" class="tab-btn" id="btn-evrak">📁 Evrak Takip</button>
      </div>
    </div>

    <!-- Modül Alanı -->
    <div id="content-area"></div>
  </div>

  <footer>
    © Rakım Erkutlu İlkokulu - Öğretmen Yönetim Portalı
  </footer>

  <script>
    let activeTab = 'etkinlik'; // Varsayılan Sosyal Etkinlik
    let selectedClass = '2-A';
    let selectedTeacher = null;
    let selectedTerm = '1. Dönem';

    const classes = ['1-A', '1-B', '2-A', '2-B', '3-A', '3-B', '4-A', '4-B'];
    const teachers = ['YÜKSEL TANRIVERDİ', 'ESRA ALACA', 'İLKAY YEGANE', 'HATİCE KIRKIZ', 'ERGÜL TANRISEVEN', 'GÜLSEHER KONAKLI', 'GÜL UNGAN', 'AYLİN UYGUN'];
    
    const students = {
      '1-A': ['ALYA DEVRİM AYDIN', 'AYŞE NİSA ECEVİT', 'AZRA ÇATAN', 'EFE MEHMET AKTAN', 'EMRAH SERPEN', 'MEHMET SELİM ÖRDEK', 'MİRAN EMİN DEMİR', 'YAREN BÜLBÜL', 'MİRAÇ ASİL YÖRE', 'ROJHAT ECEVİT', 'MUHAMMED NAIF', 'YUSUF DABDABEN', 'HALE HIRFAN', 'SEM HIRFAN', 'YAKUP EL UGLA', 'VAHID TAHHAN', 'NIDAL NAIF', 'AYŞE HIRFAN', 'MIRAL ELHACTALİB'],
      '1-B': ['AHMET ÖZMEN', 'NEFES ÜSTEBAY', 'ALİ YÜCEL', 'ALMİNA MASAL BİLMEDİ', 'ARYA CAYMAZ', 'HAVİN OCAĞ', 'BUĞLEM ADA MATSAR', 'DENİZ ÖZSOY', 'ELANUR UZTEMUR', 'HÜMEYRA DAĞTEKİN', 'MUAZ ALİ KULAŞ', 'YAĞIZ PİRENVİSE', 'FERHAT MURAD', 'NURİ NAİF', 'MUHAMMED MUHAMMED', 'HANİN HERFAN', 'YUSUF ELUKLA', 'İBRAHİM HAMZA', 'MUSTAFA HAMZA', 'NURELHUDE RECEP'],
      '2-A': ['ABDULLAH BÜLKÜ', 'BERAT KULAŞ', 'DEVRAN ÖZSOY', 'ESİLA ÖRDEK', 'ESLEM YURT', 'MİNA EVRA DÖĞER', 'MUHAMMED EYMEN ÖZSOY', 'YUSUF İVEDİ', 'NİSANUR AKDAĞ', 'BERIVAN ÖRDEK', 'EZGİ ULUTAŞ', 'HÜLYA ÜREYİL', 'MUHAMMED HÜSEYİN DEĞİRMENCİ', 'AHMED ABDULRAHMAN', 'RUSLIN OSMAN', 'MUHAMMED SIDO', 'HATTAB BERGUT', 'RUHEF HAKKI', 'AYŞE ALHALO', 'İLEF AHMED'],
      '2-B': ['ALPER AYDOĞAN', 'REYYAN ŞANİ', 'HALİL YILDIRIM', 'MEHMET TALHA KURNAZ', 'MUHAMMED SELİM BÜLKÜ', 'ÖYKÜ YILMAZ', 'ELİF KOSKA', 'FATMANUR ÇELİK', 'GÜLŞAH RONAHİ KEVSER ECEVİT', 'KADER KORKMAZ', 'ARAS BULUT YARIMAY', 'ASMİN MATSAR', 'HIRANUR CEMİLE ÇİÇEKLİ', 'TUĞBA ULUTAŞ', 'BEYZANUR BÜLBÜL', 'MUHAMMAD ABDURRAHMAN', 'MAHMUD HAMİDİ', 'AHMED AHMED', 'AHMED KADEK'],
      '3-A': ['ARYA OKULMUŞ', 'AYSİMA ÖRDEK', 'AYŞE GÜL ORUÇ', 'BURAK ECEVÍT', 'DEFNE SU ÇETİN', 'ELISA SU BAYRAM', 'MUHAMMED EMİR YAĞAR', 'YUSUF CAN ÇİÇEKLİ', 'HÜSEYİN HABEŞ', 'ROYA ALO', 'NUCIN HIDDO', 'BAHAR KADEK', 'HOZAN HACMUSA', 'MEYSA ABDULRAHMAN', 'MUHAMMED KUR'],
      '3-B': ['ABDULRAHΜΑΝ HANNUŞ', 'HIRA NUR GÖKSU', 'HÜSEYİN DAĞTEKİN', 'MİRAÇ ÖRDEK', 'CANE HANNUŞ', 'NEHİR UZAR', 'POYRAZ ÖZEL', 'ÜZEYİR BÜLKÜ', 'MİRAN KORKMAZ', 'ASEL ÖZMEN', 'MENESA ORAL', 'KAMAR SIDO', 'MIRAL SIDO', 'RULA KADEK', 'YUNUS OSMAN', 'MAHMUD BARGUD'],
      '4-A': ['BERFİN ÖRDEK', 'EMİR HAKİM ÇELİK', 'HIRANUR AKDAĞ', 'HÜSEYİN EKREM OKULMUŞ', 'İBRAHİM BUĞRA SEÇEN', 'YİĞİT HAKTAN KULACA', 'MUHAMMED EYÜP BİLGİLİ', 'REŞAT CEMAL CAN ECEVİT', 'ESILA AKÇAY', 'HİRANUR ARTIK', 'ZEYNEP TAMİRCAN', 'NAZENİN KARAKAYA', 'MUHAMMED MAMO', 'RONI ALO', 'MUHAMMED HAMMET', 'AHMED MUHAMMED', 'YASEMIN RESO', 'MUHAMMED HAMZA', 'NECAT HAMIDI', 'ILYANA ABDURRAHMAN'],
      '4-B': ['ALİ EREN SEVEN', 'BERAT ALPASLAN DINDAR', 'BETÜL MATSAR', 'BİLGESU BARAN', 'EREN YARIMAY', 'MEHMET ALİ ERKUŞ', 'ÖMER ALİ KESER', 'SALİH UYGÜL', 'SEYFETTİN MİRAÇ HASATEŞ', 'HALİL İBRAHİM KAYA', 'DERİN OKULMUŞ', 'BERZAN BİLMEDİ', 'YUSUF ÇİÇEKLİ', 'DURU RÜYA ASLAN', 'NEHİR ECEVİT', 'BÜŞRA AYAZ', 'MELISA ECEVİT', 'NAIF HERFAN', 'SEMİR DABDABEN', 'VOLKAN HASAN']
    };

    let socialData = {};
    let docsData = {};

    function initFirebase() {
      if (!window.db) {
        setTimeout(initFirebase, 200);
        return;
      }

      // Sosyal Etkinlik Verilerini Dinle
      try {
        window.onSnapshot(window.collection(window.db, "social_activities"), (snapshot) => {
          socialData = {};
          snapshot.forEach(d => { socialData[d.id] = d.data(); });
          render();
        });
      } catch(e) {}

      // Evrak Verilerini Dinle
      try {
        window.onSnapshot(window.collection(window.db, "teacher_docs"), (snapshot) => {
          docsData = {};
          snapshot.forEach(d => { docsData[d.id] = d.data(); });
          render();
        });
      } catch(e) {}
    }

    async function saveSocialEntry(studentName, field, value) {
      if (!window.db) return;
      const docKey = `${selectedClass}_${studentName}`;
      await window.setDoc(window.doc(window.db, "social_activities", docKey), {
        class: selectedClass,
        studentName: studentName,
        [field]: value,
        updatedAt: new Date().toISOString()
      }, { merge: true });
    }
    window.saveSocialEntry = saveSocialEntry;

    function switchTab(tab) {
      activeTab = tab;
      render();
    }
    window.switchTab = switchTab;

    function selectClass(cls) {
      selectedClass = cls;
      render();
    }
    window.selectClass = selectClass;

    function selectTeacher(name) {
      selectedTeacher = name;
      render();
    }
    window.selectTeacher = selectTeacher;

    function render() {
      document.getElementById('btn-etkinlik').className = `tab-btn ${activeTab === 'etkinlik' ? 'active' : ''}`;
      document.getElementById('btn-evrak').className = `tab-btn ${activeTab === 'evrak' ? 'active' : ''}`;

      const contentArea = document.getElementById('content-area');

      if (activeTab === 'etkinlik') {
        const classStudents = students[selectedClass] || [];

        contentArea.innerHTML = `
          <div style="margin-bottom: 15px;">
            <p style="font-size: 11px; color: #718096; margin-bottom: 6px; font-weight: bold;">SINIF SEÇİNİZ:</p>
            <div class="chip-container">
              ${classes.map(c => `
                <button onclick="selectClass('${c}')" class="chip ${selectedClass === c ? 'active' : ''}">${c} Sınıfı</button>
              `).join('')}
            </div>
          </div>

          <h3 style="font-size: 14px; color: #2b6cb0; margin-bottom: 10px;">📋 ${selectedClass} Sınıfı Sosyal Etkinlik Girişi</h3>

          <table>
            <thead>
              <tr>
                <th style="width: 30px;">#</th>
                <th>Öğrenci Adı Soyadı</th>
                <th style="width: 180px;">Sosyal Kulüp</th>
                <th>Etkinlik / Görev</th>
              </tr>
            </thead>
            <tbody>
              ${classStudents.map((st, index) => {
                const key = `${selectedClass}_${st}`;
                const stData = socialData[key] || {};
                return `
                  <tr>
                    <td>${index + 1}</td>
                    <td style="font-weight: 600;">${st}</td>
                    <td>
                      <select onchange="saveSocialEntry('${st}', 'club', this.value)">
                        <option value="">-- Kulüp Seçin --</option>
                        <option value="Spor Kulübü" ${stData.club === 'Spor Kulübü' ? 'selected' : ''}>Spor Kulübü</option>
                        <option value="Değerler Kulübü" ${stData.club === 'Değerler Kulübü' ? 'selected' : ''}>Değerler Kulübü</option>
                        <option value="Kütüphanecilik Kulübü" ${stData.club === 'Kütüphanecilik Kulübü' ? 'selected' : ''}>Kütüphanecilik Kulübü</option>
                        <option value="Görsel Sanatlar Kulübü" ${stData.club === 'Görsel Sanatlar Kulübü' ? 'selected' : ''}>Görsel Sanatlar Kulübü</option>
                        <option value="Kızılay Kulübü" ${stData.club === 'Kızılay Kulübü' ? 'selected' : ''}>Kızılay Kulübü</option>
                        <option value="Yeşilay Kulübü" ${stData.club === 'Yeşilay Kulübü' ? 'selected' : ''}>Yeşilay Kulübü</option>
                      </select>
                    </td>
                    <td>
                      <input type="text" value="${stData.activity \vert{}\vert{} ''}" onblur="saveSocialEntry('${st}', 'activity', this.value)" placeholder="Etkinlik adını girin...">
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } else {
        contentArea.innerHTML = `
          <div style="margin-bottom: 15px;">
            <p style="font-size: 11px; color: #718096; margin-bottom: 6px; font-weight: bold;">ÖĞRETMEN SEÇİNİZ:</p>
            <div class="chip-container">
              ${teachers.map(t => `
                <button onclick="selectTeacher('${t}')" class="chip ${selectedTeacher === t ? 'active' : ''}">${t}</button>
              `).join('')}
            </div>
          </div>

          ${selectedTeacher ? `
            <h3 style="font-size: 14px; color: #2b6cb0; margin-bottom: 10px;">📁 Evrak Listesi (${selectedTeacher})</h3>
            <p style="font-size: 12px; color: #a0aec0;">Evrak yükleme ve teslim takibi modülü aktif.</p>
          ` : `
            <p style="font-size: 12px; color: #a0aec0; text-align: center; padding: 20px;">Lütfen yukarıdan isminizi seçiniz.</p>
          `}
        `;
      }
    }

    render();
    initFirebase();
  </script>

</body>
</html>
