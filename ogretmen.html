<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased p-4 md:p-6">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden relative" id="app"></div>

  <script>
    // Rakım Erkutlu İlkokulu Sınıf ve Öğrenci Verileri
    const data = {
      classes: ['1-A', '1-B', '2-A', '2-B', '3-A', '3-B', '4-A', '4-B'],
      events: ['29 Ekim Töreni', 'Masa Tenisi Turnuvası', 'İngilizce Drama Gösterisi', 'Sosyal Etkinlik / Kulüp Çalışması'],
      students: {
        '1-A': ['ALYA DEVRİM AYDIN', 'AYŞE NİSA ECEVİT', 'AZRA ÇATAN', 'EFE MEHMET AKTAN', 'EMRAH SERPEN', 'MEHMET SELİM ÖRDEK', 'MİRAN EMİN DEMİR', 'YAREN BÜLBÜL', 'MİRAÇ ASİL YÖRE', 'ROJHAT ECEVİT', 'MUHAMMED NAIF', 'YUSUF DABDABEN', 'HALE HIRFAN', 'SEM HIRFAN', 'YAKUP EL UGLA', 'VAHID TAHHAN', 'NIDAL NAIF', 'AYŞE HIRFAN', 'MIRAL ELHACTALİB'],
        '1-B': ['AHMET ÖZMEN', 'NEFES ÜSTEBAY', 'ALİ YÜCEL', 'ALMİNA MASAL BİLMEDİ', 'ARYA CAYMAZ', 'HAVİN OCAĞ', 'BUĞLEM ADA MATSAR', 'DENİZ ÖZSOY', 'ELANUR UZTEMUR', 'HÜMEYRA DAĞTEKİN', 'MUAZ ALİ KULAŞ', 'YAĞIZ PİRENVİSE', 'FERHAT MURAD', 'NURİ NAİF', 'MUHAMMED MUHAMMED', 'HANİN HERFAN', 'YUSUF ELUKLA', 'İBRAHİM HAMZA', 'MUSTAFA HAMZA', 'NURELHUDE RECEP'],
        '2-A': ['ABDULLAH BÜLKÜ', 'BERAT KULAŞ', 'DEVRAN ÖZSOY', 'ESİLA ÖRDEK', 'ESLEM YURT', 'MİNA EVRA DÖĞER', 'MUHAMMED EYMEN ÖZSOY', 'YUSUF İVEDİ', 'NİSANUR AKDAĞ', 'BERIVAN ÖRDEK', 'EZGİ ULUTAŞ', 'HÜLYA ÜREYİL', 'MUHAMMED HÜSEYİN DEĞİRMENCİ', 'AHMED ABDULRAHMAN', 'RUSLIN OSMAN', 'MUHAMMED SIDO', 'HATTAB BERGUT', 'RUHEF HAKKI', 'AYŞE ALHALO', 'İLEF AHMED'],
        '2-B': ['ALPER AYDOĞAN', 'REYYAN ŞANİ', 'HALİL YILDIRIM', 'MEHMET TALHA KURNAZ', 'MUHAMMED SELİM BÜLKÜ', 'ÖYKÜ YILMAZ', 'ELİF KOSKA', 'FATMANUR ÇELİK', 'GÜLŞAH RONAHİ KEVSER ECEVİT', 'KADER KORKMAZ', 'ARAS BULUT YARIMAY', 'ASMİN MATSAR', 'HIRANUR CEMİLE ÇİÇEKLİ', 'TUĞBA ULUTAŞ', 'BEYZANUR BÜLBÜL', 'MUHAMMAD ABDURRAHMAN', 'MAHMUD HAMİDİ', 'AHMED AHMED', 'AHMED KADEK'],
        '3-A': ['ARYA OKULMUŞ', 'AYSİMA ÖRDEK', 'AYŞE GÜL ORUÇ', 'BURAK ECEVÍT', 'DEFNE SU ÇETİN', 'ELISA SU BAYRAM', 'MUHAMMED EMİR YAĞAR', 'YUSUF CAN ÇİÇEKLİ', 'HÜSEYİN HABEŞ', 'ROYA ALO', 'NUCIN HIDDO', 'BAHAR KADEK', 'HOZAN HACMUSA', 'MEYSA ABDULRAHMAN', 'MUHAMMED KUR'],
        '3-B': ['ABDULRAHΜΑΝ HANNUŞ', 'HIRA NUR GÖKSU', 'HÜSEYİN DAĞTEKİN', 'MİRAÇ ÖRDEK', 'CANE HANNUŞ', 'NEHİR UZAR', 'POYRAZ ÖZEL', 'ÜZEYİR BÜLKÜ', 'MİRAN KORKMAZ', 'ASEL ÖZMEN', 'MENESA ORAL', 'KAMAR SIDO', 'MIRAL SIDO', 'RULA KADEK', 'YUNUS OSMAN', 'MAHMUD BARGUD'],
        '4-A': ['BERFİN ÖRDEK', 'EMİR HAKİM ÇELİK', 'HIRANUR AKDAĞ', 'HÜSEYİN EKREM OKULMUŞ', 'İBRAHİM BUĞRA SEÇEN', 'YİĞİT HAKTAN KULACA', 'MUHAMMED EYÜP BİLGİLİ', 'REŞAT CEMAL CAN ECEVİT', 'ESILA AKÇAY', 'HİRANUR ARTIK', 'ZEYNEP TAMİRCAN', 'NAZENİN KARAKAYA', 'MUHAMMED MAMO', 'RONI ALO', 'MUHAMMED HAMMET', 'AHMED MUHAMMED', 'YASEMIN RESO', 'MUHAMMED HAMZA', 'NECAT HAMIDI', 'ILYANA ABDURRAHMAN'],
        '4-B': ['ALİ EREN SEVEN', 'BERAT ALPASLAN DINDAR', 'BETÜL MATSAR', 'BİLGESU BARAN', 'EREN YARIMAY', 'MEHMET ALİ ERKUŞ', 'ÖMER ALİ KESER', 'SALİH UYGÜL', 'SEYFETTİN MİRAÇ HASATEŞ', 'HALİL İBRAHİM KAYA', 'DERİN OKULMUŞ', 'BERZAN BİLMEDİ', 'YUSUF ÇİÇEKLİ', 'DURU RÜYA ASLAN', 'NEHİR ECEVİT', 'BÜŞRA AYAZ', 'MELISA ECEVİT', 'NAIF HERFAN', 'SEMİR DABDABEN', 'VOLKAN HASAN']
      }
    };

    let activeTab = 'social'; // 'social' veya 'documents'
    let currentStep = 'classes';
    let selectedClass = null;
    let selectedEvent = null;
    let records = {};
    let isMenuOpen = false;

    function toggleMenu() {
      isMenuOpen = !isMenuOpen;
      render();
    }

    function switchTab(tab) {
      activeTab = tab;
      currentStep = 'classes';
      selectedClass = null;
      selectedEvent = null;
      isMenuOpen = false;
      render();
    }

    function renderHeader() {
      return `
        <div class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-blue-600 p-5 text-white">
          <div class="flex justify-between items-center mb-4">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">Rakım Erkutlu İlkokulu</span>
              <h1 class="text-xl font-bold tracking-tight">Öğretmen Paneli</h1>
            </div>
            <div class="relative">
              <button onclick="toggleMenu()" class="p-2 text-indigo-100 hover:text-white hover:bg-white/10 rounded-lg transition-all text-xl font-bold leading-none">
                &#8942;
              </button>
              ${isMenuOpen ? `
                <div class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-slate-100 z-50 py-1.5 text-slate-700">
                  <button onclick="addNewEvent()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium transition-colors">
                    <span class="mr-2">➕</span> Yeni Etkinlik Ekle
                  </button>
                  <button onclick="updateEventName()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium border-t border-slate-100 transition-colors">
                    <span class="mr-2">✏️</span> Etkinlik Adı Güncelle
                  </button>
                  <button onclick="showMissingClasses()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium border-t border-slate-100 transition-colors">
                    <span class="mr-2">🏫</span> Tamamlanmayan Sınıflar
                  </button>
                  <button onclick="showMissingStudents()" class="flex items-center w-full text-left px-4 py-2.5 text-sm hover:bg-indigo-50 hover:text-indigo-600 font-medium border-t border-slate-100 transition-colors">
                    <span class="mr-2">📋</span> Verileri Eksik Öğrenciler
                  </button>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Modül Sekmeleri -->
          <div class="flex space-x-2 bg-indigo-900/40 p-1 rounded-xl backdrop-blur-sm border border-white/10">
            <button onclick="switchTab('social')" class="flex-1 py-2 px-3 text-xs md:text-sm font-semibold rounded-lg transition-all ${activeTab === 'social' ? 'bg-white text-indigo-700 shadow-sm' : 'text-indigo-100 hover:text-white hover:bg-white/5'}">
              🏆 Sosyal Etkinlik Takip
            </button>
            <button onclick="switchTab('documents')" class="flex-1 py-2 px-3 text-xs md:text-sm font-semibold rounded-lg transition-all ${activeTab === 'documents' ? 'bg-white text-indigo-700 shadow-sm' : 'text-indigo-100 hover:text-white hover:bg-white/5'}">
              📁 Evrak Takip
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      
      // Evrak Takip Modülü Görünümü (Gelecek Modül Alanı)
      if (activeTab === 'documents') {
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6 text-center py-12">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
              📁
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">Evrak Takip Modülü</h3>
            <p class="text-sm text-slate-500 max-w-sm mx-auto mb-6">
              Bu modül yakında hizmete girecektir. Yıllık planlar, zümre tutanakları ve teslim edilecek evraklar buradan takip edilecektir.
            </p>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
              ⏳ Hazırlık Aşamasında
            </span>
          </div>
        `;
        return;
      }

      // Sosyal Etkinlik Takip Modülü Görünümleri
      if (currentStep === 'classes') {
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">Sınıf Seçiniz</h2>
            <div class="grid grid-cols-2 gap-3">
              ${data.classes.map(c => `
                <button onclick="selectClass('${c}')" class="p-4 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl font-bold text-slate-700 hover:text-indigo-700 shadow-sm transition-all text-center flex flex-col items-center justify-center space-y-1 group">
                  <span class="text-lg group-hover:scale-110 transition-transform">🏫</span>
                  <span>${c} Sınıfı</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } 
      else if (currentStep === 'events') {
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6">
            <div class="flex items-center justify-between mb-5">
              <div class="flex items-center space-x-2">
                <span class="text-lg font-bold text-slate-800">${selectedClass} Sınıfı</span>
                <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-semibold">Etkinlik Seçimi</span>
              </div>
              <button onclick="goBack('classes')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-medium transition-colors">
                ← Sınıf Değiştir
              </button>
            </div>
            
            <div class="space-y-3">
              ${data.events.map(ev => {
                const isCompleted = checkEventCompleted(selectedClass, ev);
                return `
                  <button onclick="selectEvent('${ev}')" class="w-full p-4 rounded-xl border text-left flex justify-between items-center transition-all ${isCompleted ? 'bg-emerald-50/60 border-emerald-200 text-emerald-900 shadow-sm' : 'bg-white border-slate-200 hover:border-indigo-300 text-slate-800 shadow-sm'}">
                    <span class="font-semibold text-sm">${ev}</span>${isCompleted ? '<span class="bg-emerald-100 text-emerald-700 font-bold text-xs px-2.5 py-1 rounded-full flex items-center">✔️ Tamamlandı</span>' : '<span class="text-slate-400 text-xs font-medium">Giriş Yap →</span>'}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } 
      else if (currentStep === 'students') {
        const studentList = data.students[selectedClass] || [];
        app.innerHTML = `
          ${renderHeader()}
          <div class="p-6">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
              <div>
                <h2 class="text-base font-bold text-slate-800">${selectedEvent}</h2>
                <p class="text-xs text-slate-500 font-medium">${selectedClass} Sınıfı • Toplam ${studentList.length} Öğrenci</p>
              </div>
              <button onclick="goBack('events')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-medium transition-colors">
                ← Etkinlikler
              </button>
            </div>

            <div class="space-y-2.5 my-4 max-h-[50vh] overflow-y-auto pr-1">
              ${studentList.map(st => {
                const key = `${selectedClass}_${selectedEvent}_${st}`;
                const val = records[key];
                return `
                  <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 flex flex-col space-y-2">
                    <span class="font-semibold text-xs text-slate-700 uppercase tracking-wide">${st}</span>
                    <div class="flex space-x-2">
                      <button onclick="toggleSelect('${st}', 'katilim')" class="flex-1 py-1.5 text-xs font-bold rounded-lg border transition-all ${val === 'katilim' ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'}">
                        Katılım
                      </button>
                      <button onclick="toggleSelect('${st}', 'performans')" class="flex-1 py-1.5 text-xs font-bold rounded-lg border transition-all ${val === 'performans' ? 'bg-purple-600 text-white border-purple-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'}">
                        Performans
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <button onclick="saveData()" class="w-full mt-2 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition-all text-sm">
              Kaydet ve Tamamla
            </button>
          </div>
        `;
      }
    }

    // 1. Yeni Etkinlik Ekle
    function addNewEvent() {
      isMenuOpen = false;
      const newEventName = prompt("Yeni Sosyal Etkinlik Adını Giriniz:");
      if (newEventName && newEventName.trim() !== "") {
        data.events.push(newEventName.trim());
        alert(`"${newEventName}" başarıyla eklendi!`);
        render();
      }
    }

    // 2. Etkinlik Adı Güncelle
    function updateEventName() {
      isMenuOpen = false;
      if (data.events.length === 0) {
        alert("Güncellenecek etkinlik bulunamadı.");
        return;
      }
      let eventListStr = data.events.map((e, index) => `${index + 1}. ${e}`).join("\n");
      let selectedIndex = prompt("Güncellemek istediğiniz etkinliğin numarasını giriniz:\n\n" + eventListStr);
      
      let index = parseInt(selectedIndex) - 1;
      if (!isNaN(index) && index >= 0 && index < data.events.length) {
        let oldName = data.events[index];
        let newName = prompt(`"${oldName}" için yeni adı giriniz:`, oldName);
        if (newName && newName.trim() !== "") {
          data.events[index] = newName.trim();
          alert("Etkinlik adı başarıyla güncellendi!");
          render();
        }
      }
    }

    // 3. Tamamlanmayan Sınıflar
    function showMissingClasses() {
      isMenuOpen = false;
      let targetEvent = selectedEvent || prompt("Hangi etkinlik için kontrol edilsin?", data.events[0]);
      if (!targetEvent || !data.events.includes(targetEvent)) return;

      let uncompletedClasses = data.classes.filter(c => !checkEventCompleted(c, targetEvent));

      if (uncompletedClasses.length === 0) {
        alert(`"${targetEvent}" için tüm sınıflarda veri girişi başlatılmış! 🎉`);
      } else {
        alert(`"${targetEvent}" için Henüz Giriş Yapmayan Sınıflar:\n\n` + uncompletedClasses.map(c => `• ${c} Sınıfı`).join("\n"));
      }
    }

    // 4. Verileri Eksik / Girilmeyen Öğrenciler
    function showMissingStudents() {
      isMenuOpen = false;
      let targetEvent = selectedEvent;
      if (!targetEvent) {
        targetEvent = prompt("Hangi etkinlik için kontrol edilsin?", data.events[0]);
      }
      if (!targetEvent || !data.events.includes(targetEvent)) return;

      let missingList = [];
      data.classes.forEach(c => {
        const studentList = data.students[c] || [];
        studentList.forEach(st => {
          const key = `${c}_${targetEvent}_${st}`;
          if (!records[key]) {
            missingList.push(`[${c}] ${st}`);
          }
        });
      });

      if (missingList.length === 0) {
        alert(`"${targetEvent}" etkinliği için tüm öğrencilerin girişi tamamlanmış! 🎉`);
      } else {
        alert(`"${targetEvent}" için Giriş Yapılmayan Öğrenciler (${missingList.length} Kişi):\n\n` + missingList.join("\n"));
      }
    }

    function selectClass(c) { selectedClass = c; currentStep = 'events'; render(); }
    function selectEvent(ev) { selectedEvent = ev; currentStep = 'students'; render(); }
    function goBack(step) { currentStep = step; render(); }

    function toggleSelect(student, type) {
      const key = `${selectedClass}_${selectedEvent}_${student}`;
      if (records[key] === type) {
        delete records[key];
      } else {
        records[key] = type;
      }
      render();
    }

    function saveData() {
      alert('Kayıt başarıyla tamamlandı!');
      currentStep = 'events';
      render();
    }

    function checkEventCompleted(sClass, sEvent) {
      return Object.keys(records).some(k => k.startsWith(`${sClass}_${sEvent}_`));
    }

    render();
  </script>
</body>
</html>
