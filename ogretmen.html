<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İdareci Paneli - Râkım Erkutlu İlkokulu</title>

  <!-- Firebase Bulut Veritabanı Bağlantısı -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBICjJMMMT3Z1FgsbR2kaUIhNrqvRcg7wM",
      authDomain: "rakim-erkutlu-io-ogretmen.firebaseapp.com",
      projectId: "rakim-erkutlu-io-ogretmen",
      storageBucket: "rakim-erkutlu-io-ogretmen.firebasestorage.app",
      messagingSenderId: "35323173695",
      appId: "1:35323173695:web:3031e2107a3e3bf0c8918a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }
    h1 {
      text-align: center;
      color: #1a365d;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .status-badge {
      display: inline-block;
      background-color: #e6fffa;
      color: #234e52;
      border: 1px solid #b2f5ea;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
    }
    .section {
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #2b6cb0;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .event-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .event-chip {
      background-color: #edf2f7;
      border: 1px solid #cbd5e0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .event-chip.active {
      background-color: #3182ce;
      color: #ffffff;
      border-color: #3182ce;
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .class-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
    }
    .class-card.completed {
      background-color: #f0fff4;
      border-color: #9ae6b4;
    }
    .class-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .class-name {
      font-weight: 700;
      color: #2d3748;
      font-size: 14px;
    }
    .class-percent {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: #e2e8f0;
      color: #4a5568;
    }
    .class-card.completed .class-percent {
      background-color: #c6f6d5;
      color: #22543d;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #3182ce;
      transition: width 0.4s ease;
    }
    .class-card.completed .progress-bar-fill {
      background-color: #38a169;
    }
    details {
      font-size: 12px;
      color: #4a5568;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #3182ce;
    }
    summary:hover {
      text-decoration: underline;
    }
    .student-list {
      list-style: none;
      margin-top: 8px;
      max-height: 120px;
      overflow-y: auto;
      border-left: 2px solid #cbd5e0;
      padding-left: 8px;
    }
    .student-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 11px;
    }
    .status-katilim {
      color: #2b6cb0;
      font-weight: 700;
    }
    .status-performans {
      color: #6b46c1;
      font-weight: 700;
    }
    .status-none {
      color: #a0aec0;
      font-style: italic;
    }
    footer {
      margin-top: auto;
      padding-top: 20px;
      font-size: 12px;
      color: #a0aec0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏛️ İdareci Paneli</h1>
    <p class="subtitle">Râkım Erkutlu İlkokulu Yönetim Sistemi <br>
      <span class="status-badge">● Canlı Bulut Bağlantısı Aktif</span>
    </p>

    <!-- Sosyal Etkinlik Canlı Takip Modülü -->
    <div class="section">
      <div class="section-title">
        <span>📊 Canlı Sosyal Etkinlik Takibi</span>
      </div>
      
      <p style="font-size: 12px; color: #718096; margin-bottom: 10px;">İncelemek istediğiniz etkinliği seçin:</p>
      
      <div class="event-selector" id="eventSelector">
        <span style="font-size: 12px; color: #a0aec0;">Etkinlikler yükleniyor...</span>
      </div>

      <div class="class-grid" id="classGrid">
        <!-- Sınıf Kartları Dinamik Yüklenecek -->
      </div>
    </div>

    <!-- Evrak Takip Modülü -->
    <div class="section">
      <div class="section-title">
        <span>📁 Evrak Takip</span>
      </div>
      <div style="background-color: #f7fafc; padding: 14px 20px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; color: #a0aec0; font-weight: 600; font-size: 14px;">
        <span>Gelen / Giden Evrak Kayıt (Yakında)</span>
        <span>🔒</span>
      </div>
    </div>

  </div>

  <footer>
    © Râkım Erkutlu İlkokulu - İdari Yönetim Portalı
  </footer>

  <script>
    const classes = ['1-A', '1-B', '2-A', '2-B', '3-A', '3-B', '4-A', '4-B'];
    const students = {
      '1-A': ['ALYA DEVRİM AYDIN', 'AYŞE NİSA ECEVİT', 'AZRA ÇATAN', 'EFE MEHMET AKTAN', 'EMRAH SERPEN', 'MEHMET SELİM ÖRDEK', 'MİRAN EMİN DEMİR', 'YAREN BÜLBÜL', 'MİRAÇ ASİL YÖRE', 'ROJHAT ECEVİT', 'MUHAMMED NAIF', 'YUSUF DABDABEN', 'HALE HIRFAN', 'SEM HIRFAN', 'YAKUP EL UGLA', 'VAHID TAHHAN', 'NIDAL NAIF', 'AYŞE HIRFAN', 'MIRAL ELHACTALİB'],
      '1-B': ['AHMET ÖZMEN', 'NEFES ÜSTEBAY', 'ALİ YÜCEL', 'ALMİNA MASAL BİLMEDİ', 'ARYA CAYMAZ', 'HAVİN OCAĞ', 'BUĞLEM ADA MATSAR', 'DENİZ ÖZSOY', 'ELANUR UZTEMUR', 'HÜMEYRA DAĞTEKİN', 'MUAZ ALİ KULAŞ', 'YAĞIZ PİRENVİSE', 'FERHAT MURAD', 'NURİ NAİF', 'MUHAMMED MUHAMMED', 'HANİN HERFAN', 'YUSUF ELUKLA', 'İBRAHİM HAMZA', 'MUSTAFA HAMZA', 'NURELHUDE RECEP'],
      '2-A': ['ABDULLAH BÜLKÜ', 'BERAT KULAŞ', 'DEVRAN ÖZSOY', 'ESİLA ÖRDEK', 'ESLEM YURT', 'MİNA EVRA DÖĞER', 'MUHAMMED EYMEN ÖZSOY', 'YUSUF İVEDİ', 'NİSANUR AKDAĞ', 'BERIVAN ÖRDEK', 'EZGİ ULUTAŞ', 'HÜLYA ÜREYİL', 'MUHAMMED HÜSEYİN DEĞİRMENCİ', 'AHMED ABDULRAHMAN', 'RUSLIN OSMAN', 'MUHAMMED SIDO', 'HATTAB BERGUT', 'RUHEF HAKKI', 'AYŞE ALHALO', 'İLEF AHMED'],
      '2-B': ['ALPER AYDOĞAN', 'REYYAN ŞANİ', 'HALİL YILDIRIM', 'MEHMET TALHA KURNAZ', 'MUHAMMED SELİM BÜLKÜ', 'ÖYKÜ YILMAZ', 'ELİF KOSKA', 'FATMANUR ÇELİK', 'GÜLŞAH RONAHİ KEVSER ECEVİT', 'KADER KORKMAZ', 'ARAS BULUT YARIMAY', 'ASMİN MATSAR', 'HIRANUR CEMİLE ÇİÇEKLİ', 'TUĞBA ULUTAŞ', 'BEYZANUR BÜLBÜL', 'MUHAMMAD ABDURRAHMAN', 'MAHMUD HAMİDİ', 'AHMED AHMED', 'AHMED KADEK'],
      '3-A': ['ARYA OKULMUŞ', 'AYSİMA ÖRDEK', 'AYŞE GÜL ORUÇ', 'BURAK ECEVÍT', 'DEFNE SU ÇETİN', 'ELISA SU BAYRAM', 'MUHAMMED EMİR YAĞAR', 'YUSUF CAN ÇİÇEKLİ', 'HÜSEYİN HABEŞ', 'ROYA ALO', 'NUCIN HIDDO', 'BAHAR KADEK', 'HOZAN HACMUSA', 'MEYSA ABDULRAHMAN', 'MUHAMMED KUR'],
      '3-B': ['ABDULRAHΜΑΝ HANNUŞ', 'HIRA NUR GÖKSU', 'HÜSEYİN DAĞTEKİN', 'MİRAÇ ÖRDEK', 'CANE HANNUŞ', 'NEHİR UZAR', 'POYRAZ ÖZEL', 'ÜZEYİR BÜLKÜ', 'MİRAN KORKMAZ', 'ASEL ÖZMEN', 'MENESA ORAL', 'KAMAR SIDO', 'MIRAL SIDO', 'RULA KADEK', 'YUNUS OSMAN', 'MAHMUD BARGUD'],
      '4-A': ['BERFİN ÖRDEK', 'EMİR HAKİM ÇELİK', 'HIRANUR AKDAĞ', 'HÜSEYİN EKREM OKULMUŞ', 'İBRAHİM BUĞRA SEÇEN', 'YİĞİT HAKTAN KULACA', 'MUHAMMED EYÜP BİLGİLİ', 'REŞAT CEMAL CAN ECEVİT', 'ESILA AKÇAY', 'HİRANUR ARTIK', 'ZEYNEP TAMİRCAN', 'NAZENİN KARAKAYA', 'MUHAMMED MAMO', 'RONI ALO', 'MUHAMMED HAMMET', 'AHMED MUHAMMED', 'YASEMIN RESO', 'MUHAMMED HAMZA', 'NECAT HAMIDI', 'ILYANA ABDURRAHMAN'],
      '4-B': ['ALİ EREN SEVEN', 'BERAT ALPASLAN DINDAR', 'BETÜL MATSAR', 'BİLGESU BARAN', 'EREN YARIMAY', 'MEHMET ALİ ERKUŞ', 'ÖMER ALİ KESER', 'SALİH UYGÜL', 'SEYFETTİN MİRAÇ HASATEŞ', 'HALİL İBRAHİM KAYA', 'DERİN OKULMUŞ', 'BERZAN BİLMEDİ', 'YUSUF ÇİÇEKLİ', 'DURU RÜYA ASLAN', 'NEHİR ECEVİT', 'BÜŞRA AYAZ', 'MELISA ECEVİT', 'NAIF HERFAN', 'SEMİR DABDABEN', 'VOLKAN HASAN']
    };

    let events = [];
    let records = {};
    let selectedEventId = null;

    function initFirebase() {
      if (!window.db) {
        setTimeout(initFirebase, 200);
        return;
      }

      // Etkinlikleri Dinle
      window.onSnapshot(window.collection(window.db, "events"), (snapshot) => {
        events = [];
        snapshot.forEach((doc) => {
          events.push({ id: doc.id, ...doc.data() });
        });
        if (events.length > 0 && !selectedEventId) {
          selectedEventId = events[0].id;
        }
        render();
      });

      // Kayıtları Dinle
      window.onSnapshot(window.collection(window.db, "records"), (snapshot) => {
        records = {};
        snapshot.forEach((doc) => {
          records[doc.id] = doc.data().val;
        });
        render();
      });
    }

    function selectEvent(id) {
      selectedEventId = id;
      render();
    }
    window.selectEvent = selectEvent;

    function render() {
      const eventSelector = document.getElementById('eventSelector');
      const classGrid = document.getElementById('classGrid');

      if (events.length === 0) {
        eventSelector.innerHTML = '<span style="font-size: 12px; color: #a0aec0;">Henüz öğretmenler tarafından eklenmiş bir etkinlik yok.</span>';
        classGrid.innerHTML = '';
        return;
      }

      // Etkinlik Butonları Doldur
      eventSelector.innerHTML = events.map(ev => `
        <button onclick="selectEvent('${ev.id}')" class="event-chip ${selectedEventId === ev.id ? 'active' : ''}">
          ${ev.name} (${ev.date})
        </button>
      `).join('');

      const selectedEventObj = events.find(e => e.id === selectedEventId);

      if (!selectedEventObj) {
        classGrid.innerHTML = '';
        return;
      }

      // Sınıf Kartlarını Doldur
      classGrid.innerHTML = classes.map(c => {
        const classStudents = students[c] || [];
        let completedCount = 0;

        classStudents.forEach(st => {
          if (records[`${c}_${selectedEventObj.name}_${st}`]) completedCount++;
        });

        const percent = classStudents.length > 0 ? Math.round((completedCount / classStudents.length) * 100) : 0;
        const isAllDone = completedCount === classStudents.length && classStudents.length > 0;

        return `
          <div class="class-card ${isAllDone ? 'completed' : ''}">
            <div class="class-card-header">
              <span class="class-name">${c} Sınıfı</span>
              <span class="class-percent">${completedCount}/${classStudents.length} (%${percent})</span>
            </div>
            
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%;"></div>
            </div>

            <details>
              <summary>Öğrenci Detayları</summary>
              <ul class="student-list">
                ${classStudents.map(st => {
                  const val = records[`${c}_${selectedEventObj.name}_${st}`];
                  let statusHtml = '<span class="status-none">Girilmedi</span>';
                  if (val === 'katilim') statusHtml = '<span class="status-katilim">Katılım</span>';
                  if (val === 'performans') statusHtml = '<span class="status-performans">Performans</span>';

                  return `
                    <li class="student-item">
                      <span>${st}</span>${statusHtml}
                    </li>
                  `;
                }).join('')}
              </ul>
            </details>
          </div>
        `;
      }).join('');
    }

    initFirebase();
  </script>

</body>
</html>
