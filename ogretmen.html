<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen Evrak & Etkinlik Paneli - Râkım Erkutlu İlkokulu</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Bağlantısı -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBICjJMMMT3Z1FgsbR2kaUIhNrqvRcg7wM",
      authDomain: "rakim-erkutlu-io-ogretmen.firebaseapp.com",
      projectId: "rakim-erkutlu-io-ogretmen",
      storageBucket: "rakim-erkutlu-io-ogretmen.firebasestorage.app",
      messagingSenderId: "35323173695",
      appId: "1:35323173695:web:3031e2107a3e3bf0c8918a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
    window.doc = doc;
    window.setDoc = setDoc;
    window.deleteDoc = deleteDoc;
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-6 antialiased">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden" id="app"></div>

  <script>
    let activeTab = 'evrak'; // 'evrak' veya 'etkinlik'
    let selectedTeacher = null;
    let selectedTerm = '1. Dönem'; // '1. Dönem', '2. Dönem', 'Yıl Sonu'

    let teachers = ['YÜKSEL TANRIVERDİ', 'ESRA ALACA', 'İLKAY YEGANE', 'HATİCE KIRKIZ', 'ERGÜL TANRISEVEN', 'GÜLSEHER KONAKLI', 'GÜL UNGAN', 'AYLİN UYGUN'];
    let docsData = {};
    let adminApprovals = {};

    function initFirebase() {
      if (!window.db) {
        setTimeout(initFirebase, 200);
        return;
      }

      // Evrak Durumlarını Dinle
      window.onSnapshot(window.collection(window.db, "teacher_docs"), (snapshot) => {
        docsData = {};
        snapshot.forEach(docSnap => {
          docsData[docSnap.id] = docSnap.data();
        });
        render();
      });

      // İdareci Onaylarını Dinle
      window.onSnapshot(window.collection(window.db, "admin_approvals"), (snapshot) => {
        adminApprovals = {};
        snapshot.forEach(docSnap => {
          adminApprovals[docSnap.id] = docSnap.data().approved;
        });
        render();
      });
    }

    async function toggleTeacherCheck(docId) {
      if (!selectedTeacher) return;
      const current = docsData[docId]?.teacherSubmitted || false;
      await window.setDoc(window.doc(window.db, "teacher_docs", docId), {
        teacherSubmitted: !current,
        teacherName: selectedTeacher,
        updatedAt: new Date().toISOString()
      }, { merge: true });
    }
    window.toggleTeacherCheck = toggleTeacherCheck;

    function selectTeacher(name) {
      selectedTeacher = name;
      render();
    }
    window.selectTeacher = selectTeacher;

    function selectTerm(term) {
      selectedTerm = term;
      render();
    }
    window.selectTerm = selectTerm;

    function switchTab(tab) {
      activeTab = tab;
      render();
    }
    window.switchTab = switchTab;

    // Varsayılan Evrak Şablon Listesi
    const defaultDocs = [
      // 1. Dönem
      { id: '1', title: '1. Zümre Toplantı Tutanağı (Sene Başı)', term: '1. Dönem', deadline: 'Eylül Sonu', target: 'ALL' },
      { id: '2', title: '1. Veli Toplantı Tutanağı (Sene Başı)', term: '1. Dönem', deadline: 'Eylül Sonu', target: 'ALL' },
      { id: '3', title: 'Dijital Yıllık Planlar', term: '1. Dönem', deadline: 'Eylül Sonu', target: 'ALL' },
      { id: '4', title: 'BEP Planları', term: '1. Dönem', deadline: 'Ekim 1.-2. Haftası', target: ['GÜLSEHER KONAKLI', 'GÜL UNGAN'] },
      { id: '5', title: 'Spor Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['ESRA ALACA'] },
      { id: '6', title: 'Değerler Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['ERGÜL TANRISEVEN'] },
      { id: '7', title: 'Kütüphanecilik Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['GÜL UNGAN'] },
      { id: '8', title: 'Görsel Sanatlar Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['AYLİN UYGUN'] },
      { id: '9', title: 'Kızılay ve Kan Bağışı Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['İLKAY YEGANE'] },
      { id: '10', title: 'Yeşilay Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['HATİCE KIRKIZ'] },
      { id: '11', title: 'Sağlık, Temizlik ve Beslenme Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['YÜKSEL TANRIVERDİ'] },
      { id: '12', title: 'Afet Hazırlık ve Sivil Savunma Kulübü Yıllık Çalışma Planı', term: '1. Dönem', deadline: 'Ekim Başı', target: ['GÜLSEHER KONAKLI'] },
      { id: '13', title: 'İlköğretim Haftası Dosya ve Pano Hazırlığı', term: '1. Dönem', deadline: 'Eylül 3. Haftası', target: ['YÜKSEL TANRIVERDİ'] },
      { id: '14', title: 'Hayvanları Koruma Günü Dosya ve Pano Hazırlığı', term: '1. Dönem', deadline: '4 Ekim', target: ['ESRA ALACA'] },
      { id: '15', title: 'Cumhuriyet Bayramı Kutlama Programı Dosya Hazırlığı', term: '1. Dönem', deadline: '29 Ekim', target: 'ALL' },
      { id: '16', title: 'Kızılay Haftası Dosya ve Pano Hazırlığı', term: '1. Dönem', deadline: '29 Ekim - 4 Kasım', target: ['İLKAY YEGANE'] },
      { id: '17', title: 'Atatürk Haftası Anma Programı Dosya Hazırlığı', term: '1. Dönem', deadline: '10-16 Kasım', target: 'ALL' },
      { id: '18', title: 'Dünya Engelliler Günü Dosya ve Pano Hazırlığı', term: '1. Dönem', deadline: '3 Aralık', target: ['HATİCE KIRKIZ'] },
      { id: '19', title: 'İnsan Hakları ve Demokrasi Haftası Dosya ve Pano Hazırlığı', term: '1. Dönem', deadline: '10 Aralık Haftası', target: ['ESRA ALACA'] },
      { id: '20', title: 'Tutum, Yatırım ve Türk Malları Haftası Etkinlik Dosyası', term: '1. Dönem', deadline: '12-18 Aralık', target: 'ALL' },
      { id: '21', title: 'Enerji Tasarrufu Haftası Dosya ve Pano Hazırlığı', term: '1. Dönem', deadline: 'Ocak 2. Haftası', target: ['ERGÜL TANRISEVEN'] },

      // 2. Dönem
      { id: '22', title: '2. Zümre Toplantı Tutanağı (2. Dönem Başı)', term: '2. Dönem', deadline: 'Şubat Başı', target: 'ALL' },
      { id: '23', title: '2. Veli Toplantı Tutanağı (2. Dönem Başı)', term: '2. Dönem', deadline: 'Şubat Başı', target: 'ALL' },
      { id: '24', title: 'Sivil Savunma Günü Dosya ve Pano Hazırlığı', term: '2. Dönem', deadline: '28 Şubat', target: ['GÜLSEHER KONAKLI', 'YÜKSEL TANRIVERDİ'] },
      { id: '25', title: 'Yeşilay Haftası Dosya ve Pano Hazırlığı', term: '2. Dönem', deadline: '1 Mart Haftası', target: ['HATİCE KIRKIZ'] },
      { id: '26', title: 'İstiklâl Marşı\'nın Kabulü ve M. Akif Ersoy\'u Anma Programı', term: '2. Dönem', deadline: '12 Mart', target: ['İLKAY YEGANE', 'GÜL UNGAN'] },
      { id: '27', title: 'Tüketiciyi Koruma Haftası Dosya ve Pano Hazırlığı', term: '2. Dönem', deadline: '15-21 Mart', target: ['AYLİN UYGUN'] },
      { id: '28', title: 'Çanakkale Zaferi ve Şehitleri Anma Programı', term: '2. Dönem', deadline: '18 Mart', target: ['ESRA ALACA', 'ERGÜL TANRISEVEN'] },
      { id: '29', title: 'Orman Haftası Dosya ve Pano Hazırlığı', term: '2. Dönem', deadline: '21-26 Mart', target: ['GÜLSEHER KONAKLI'] },
      { id: '30', title: 'Kütüphaneler Haftası Dosya ve Pano Hazırlığı', term: '2. Dönem', deadline: 'Mart Son Pazartesi', target: ['GÜL UNGAN'] },
      { id: '31', title: '23 Nisan Ulusal Egemenlik ve Çocuk Bayramı Programı', term: '2. Dönem', deadline: '23 Nisan', target: 'ALL' },
      { id: '32', title: 'Trafik ve İlk Yardım Haftası Dosya ve Pano Hazırlığı', term: '2. Dönem', deadline: 'Mayıs İlk Haftası', target: ['AYLİN UYGUN'] },
      { id: '33', title: '19 Mayıs Atatürk\'ü Anma ve Gençlik ve Spor Bayramı Programı', term: '2. Dönem', deadline: '19 Mayıs', target: 'ALL' },

      // Yıl Sonu
      { id: '34', title: '3. Zümre Toplantı Tutanağı (Sene Sonu)', term: 'Yıl Sonu', deadline: 'Haziran Sonu', target: 'ALL' },
      { id: '35', title: '3. Veli Toplantı Tutanağı (Sene Sonu)', term: 'Yıl Sonu', deadline: 'Haziran Sonu', target: 'ALL' },
      { id: '36', title: 'Kulüp Yıl Sonu Faaliyet Raporu', term: 'Yıl Sonu', deadline: 'Haziran Sonu', target: 'ALL' },
      { id: '37', title: 'Ders Kesim Raporu', term: 'Yıl Sonu', deadline: 'Haziran Sonu', target: 'ALL' },
      { id: '38', title: 'Sınıf Rehberlik Yıl Sonu Çalışma Raporu', term: 'Yıl Sonu', deadline: 'Haziran Sonu', target: 'ALL' }
    ];

    function render() {
      const app = document.getElementById('app');

      app.innerHTML = `
        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 text-white flex justify-between items-center">
          <div>
            <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Râkım Erkutlu İlkokulu</span>
            <h1 class="text-2xl font-black">🏫 Öğretmen Yönetim Portalı</h1>
          </div>
          <div class="flex gap-2 bg-blue-950/60 p-1.5 rounded-xl border border-blue-700/50">
            <button onclick="switchTab('evrak')" class="px-4 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'evrak' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}">📁 Evrak Takip</button>
            <button onclick="switchTab('etkinlik')" class="px-4 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'etkinlik' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}">📊 Sosyal Etkinlik</button>
          </div>
        </div>

        <div class="p-6">
          ${activeTab === 'evrak' ? renderEvrakTab() : '<p class="text-center py-12 text-slate-500 font-medium">Sosyal Etkinlik Modülü Aktif</p>'}
        </div>
      `;
    }

    function renderEvrakTab() {
      if (!selectedTeacher) {
        return `
          <div class="text-center py-8">
            <h2 class="text-lg font-bold text-slate-700 mb-4">Lütfen İsminizi Seçiniz</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              ${teachers.map(t => `
                <button onclick="selectTeacher('${t}')" class="p-4 bg-slate-50 border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 rounded-xl font-bold text-slate-700 text-sm transition-all text-center">
                  👨‍🏫 ${t}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      const filteredDocs = defaultDocs.filter(d => {
        const matchesTerm = d.term === selectedTerm;
        const matchesTeacher = d.target === 'ALL' || (Array.isArray(d.target) && d.target.includes(selectedTeacher));
        return matchesTerm && matchesTeacher;
      });

      return `
        <div class="flex justify-between items-center mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div>
            <span class="text-xs text-slate-500 font-bold uppercase">Aktif Öğretmen:</span>
            <h2 class="text-lg font-black text-indigo-900">${selectedTeacher}</h2>
          </div>
          <button onclick="selectTeacher(null)" class="text-xs text-indigo-600 hover:underline font-bold">← Başka Öğretmen Seç</button>
        </div>

        <!-- Dönem Sekmeleri -->
        <div class="flex gap-2 mb-6 border-b border-slate-200 pb-3">
          ${['1. Dönem', '2. Dönem', 'Yıl Sonu'].map(term => `
            <button onclick="selectTerm('${term}')" class="px-5 py-2.5 text-xs font-bold rounded-xl transition-all ${selectedTerm === term ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              ${term}
            </button>
          `).join('')}
        </div>

        <!-- Evrak Listesi Tablosu (Sticky Başlıklı) -->
        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
          <div class="overflow-x-auto max-h-[500px]">
            <table class="w-full text-left border-collapse">
              <thead class="bg-slate-100 sticky top-0 z-10 border-b border-slate-200">
                <tr>
                  <th class="p-3 text-center w-28 bg-slate-100 font-bold text-xs text-slate-600 uppercase tracking-wider">Teslim Edildi</th>
                  <th class="p-3 font-bold text-xs text-slate-600 uppercase tracking-wider">Evrak / Görev Adı</th>
                  <th class="p-3 font-bold text-xs text-slate-600 uppercase tracking-wider w-36">Son Tarih</th>
                  <th class="p-3 font-bold text-xs text-slate-600 uppercase tracking-wider w-32 text-right">İdare Onayı</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${filteredDocs.length === 0 ? `
                  <tr><td colspan="4" class="p-6 text-center text-xs text-slate-400">Bu dönem için tanımlanmış evrak bulunmamaktadır.</td></tr>
                ` : filteredDocs.map(docItem => {
                  const docKey = `${selectedTeacher}_${docItem.id}`;
                  const isSubmitted = docsData[docKey]?.teacherSubmitted || false;
                  const isApproved = adminApprovals[docKey] || false;

                  return `
                    <tr class="transition-colors ${isApproved ? 'bg-emerald-100/80 font-medium' : isSubmitted ? 'bg-amber-50/60' : 'hover:bg-slate-50'}">
                      <td class="p-3 text-center">
                        <input type="checkbox" onchange="toggleTeacherCheck('${docKey}')" ${isSubmitted ? 'checked' : ''} class="w-5 h-5 accent-indigo-600 rounded cursor-pointer">
                      </td>
                      <td class="p-3 text-sm font-semibold text-slate-800">${docItem.title}</td>
                      <td class="p-3 text-xs font-semibold text-slate-500">${docItem.deadline}</td>
                      <td class="p-3 text-right">
                        ${isApproved 
                          ? '<span class="inline-block bg-emerald-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full">✓ Onaylandı</span>' 
                          : isSubmitted 
                          ? '<span class="inline-block bg-amber-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full">İdare Bekleniyor</span>' 
                          : '<span class="inline-block bg-slate-200 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded-full">Teslim Edilmedi</span>'}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    initFirebase();
  </script>
</body>
</html>
